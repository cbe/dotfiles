theme = "catppuccin_frappe"

[editor]
scrolloff = 999
cursorline = true
color-modes = true
insert-final-newline = true
trim-trailing-whitespace = true

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
skip-levels = 1

[editor.search]
smart-case = false

[editor.soft-wrap]
enable = true

# Custom keybindings
[keys.normal]
# Buffers
C-s = ":write"

# Selection
A-C-S-s = "save_selection" # Default is C-s which I want to use as write

