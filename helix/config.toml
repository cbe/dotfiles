theme = "catppuccin_frappe"

[editor]
scrolloff = 999
cursorline = true
color-modes = true
insert-final-newline = true
trim-trailing-whitespace = true

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
skip-levels = 1

[editor.search]
smart-case = false

[editor.soft-wrap]
enable = true

[editor.statusline]
left = [
  "mode",
  "spinner",
  "file-name",
  "file-modification-indicator",
  "file-encoding",
  "file-indent-style",
  "read-only-indicator",
]
right = [
  "diagnostics",
  "workspace-diagnostics",
  "selections",
  "register",
  "position",
  "file-encoding",
]

# Custom keybindings
[keys.normal]
# Buffers
C-S-r = ":reload-all"
C-s = ":write"

# Movement
A-w = "move_next_sub_word_start"
A-b = "move_prev_sub_word_start"

# Selection
A-C-S-s = "save_selection" # Default is C-s which I want to use as write

# Markers
## Changes
C-up = "goto_prev_change"
C-down = "goto_next_change"
## Diagnostics
C-S-y = "goto_prev_diag"
C-y = "goto_next_diag"
A-S-y = "workspace_diagnostics_picker"
A-y = "diagnostics_picker"
