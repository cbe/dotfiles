theme = "catppuccin_frappe"

[editor]
scrolloff = 999
cursorline = true
color-modes = true
insert-final-newline = true
trim-trailing-whitespace = true

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
skip-levels = 1

[editor.search]
smart-case = false

[editor.soft-wrap]
enable = true

# Custom keybindings
[keys.normal]
# Buffers
C-S-r = ":reload-all"
C-s = ":write"

# Selection
A-C-S-s = "save_selection" # Default is C-s which I want to use as write

# Markers
## Changes
C-up = "goto_prev_change"
C-down = "goto_next_change"
## Diagnostics
C-S-y = "goto_prev_diag"
C-y = "goto_next_diag"
A-S-y = "workspace_diagnostics_picker"
A-y = "diagnostics_picker"
